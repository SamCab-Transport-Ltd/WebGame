services:
  postgres:
    image: postgres:16-alpine
    container_name: webgame-postgres
    environment:
      POSTGRES_USER: webgame
      POSTGRES_PASSWORD: webgame
      POSTGRES_DB: webgame
    ports:
      - "5432:5432"
    volumes:
      - webgame_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webgame -d webgame"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: webgame-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  webgame_pg:
